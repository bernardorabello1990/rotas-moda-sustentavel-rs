<!doctype html>
<html lang="pt-BR">
<head>
  <script>
    // Se o sistema pede "menos movimento", oferecemos a escolha em vez de degradar calado.
    // "voo-movimento": '1' = usuário pediu a experiência completa; '0' = preferiu sem animações.
    (() => {
      const pede = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const escolha = localStorage.getItem('voo-movimento');
      if (pede && escolha === '1') {
        const original = window.matchMedia.bind(window);
        window.matchMedia = (q) => {
          if (typeof q === 'string' && q.includes('prefers-reduced-motion')) {
            return { matches: false, media: q, addEventListener(){}, removeEventListener(){}, addListener(){}, removeListener(){}, onchange: null, dispatchEvent(){ return false; } };
          }
          return original(q);
        };
      }
      window.__vooPerguntarMovimento = pede && escolha === null;
    })();
  </script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rotas da Moda Sustentável RS · Um voo pelos territórios</title>
  <meta name="description" content="Um sobrevoo cinematográfico pelo mundo bordado das rotas da moda sustentável do Rio Grande do Sul." />
  <style>
    :root, .sw-root {
      --sw-bg: #EDE3D4;
      --sw-ink: #3E2F23;
      --sw-ink-soft: #6B5844;
      --sw-accent: #9C4A2F;
      --sw-font-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --sw-font-body: 'Karla', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    }
    html, body { margin: 0; background: var(--sw-bg); }
  </style>
</head>
<body>
  <div id="world"></div>



  <!-- Convite pra rolar: a experiência é pilotada pelo scroll -->
  <div id="convite-voo" aria-hidden="true">
    <span>Role para voar</span>
    <b>▾</b>
  </div>
  <style>
    .sw-hint { display: none !important; }
    #convite-voo {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 60;
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 0.75rem 1.9rem; border-radius: 999px;
      background: rgba(62, 47, 35, 0.85); color: #EDE3D4;
      border: 1.5px dashed rgba(237, 227, 212, 0.55);
      font-family: 'Karla', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.82rem; letter-spacing: 0.22em; text-transform: uppercase;
      pointer-events: none; box-shadow: 0 12px 28px -14px rgba(62,47,35,.8);
      animation: convite-entra 1s ease 0.8s both;
      transition: opacity 0.2s linear;
    }
    #convite-voo b { font-size: 1.05rem; line-height: 0.7; animation: convite-pulsa 1.6s ease-in-out infinite; }
    @keyframes convite-entra { from { opacity: 0; transform: translateX(-50%) translateY(14px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes convite-pulsa { 0%, 100% { transform: translateY(0); opacity: .75; } 50% { transform: translateY(5px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #convite-voo b { animation: none; } #convite-voo { animation: none; } }
  </style>
  <script>
    (() => {
      const cue = document.getElementById('convite-voo');
      addEventListener('scroll', () => {
        cue.style.animation = 'none';
        cue.style.opacity = Math.max(0, 1 - scrollY / (0.45 * innerHeight));
      }, { passive: true });
    })();
  </script>


  <!-- Escolha de movimento (só aparece quando o sistema pede menos animação) -->
  <div id="escolha-movimento" hidden>
    <div class="em-cartao">
      <p class="em-titulo">Seu dispositivo está configurado para reduzir animações</p>
      <p class="em-texto">Este é um sobrevoo animado pelo mundo bordado das rotas. Você decide como prefere ver:</p>
      <div class="em-acoes">
        <button id="em-sim" type="button">Ver com animações</button>
        <button id="em-nao" type="button">Continuar sem animações</button>
      </div>
    </div>
  </div>
  <style>
    #escolha-movimento {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(62, 47, 35, 0.55); padding: 20px;
    }
    #escolha-movimento[hidden] { display: none; }
    .em-cartao {
      max-width: 430px; background: #EDE3D4; color: #3E2F23;
      border: 1.5px dashed #9C4A2F; border-radius: 16px;
      padding: 1.8rem 1.9rem; text-align: center;
      font-family: 'Karla', -apple-system, 'Helvetica Neue', Arial, sans-serif;
      box-shadow: 0 30px 60px -25px rgba(62,47,35,.8);
    }
    .em-titulo { font-family: Georgia, serif; font-size: 1.25rem; margin: 0 0 0.5rem; }
    .em-texto { font-size: 0.95rem; color: #6B5844; margin: 0 0 1.2rem; }
    .em-acoes { display: flex; gap: 0.7rem; justify-content: center; flex-wrap: wrap; }
    .em-acoes button {
      padding: 0.75rem 1.5rem; border-radius: 999px; font-size: 0.9rem;
      font-family: inherit; cursor: pointer; letter-spacing: 0.03em;
    }
    #em-sim { background: #9C4A2F; color: #EDE3D4; border: 1px solid #9C4A2F; }
    #em-nao { background: transparent; color: #3E2F23; border: 1px solid rgba(62,47,35,.45); }
  </style>
  <script>
    (() => {
      if (!window.__vooPerguntarMovimento) return;
      const ov = document.getElementById('escolha-movimento');
      ov.hidden = false;
      document.getElementById('em-sim').addEventListener('click', () => {
        localStorage.setItem('voo-movimento', '1'); location.reload();
      });
      document.getElementById('em-nao').addEventListener('click', () => {
        localStorage.setItem('voo-movimento', '0'); ov.hidden = true;
      });
    })();
  </script>

  <script src="scrub-engine.js"></script>

      diveScroll: 1.5,
      connScroll: 0.94,
      sections: [
        {

          accent: '#9C4A2F',
          eyebrow: 'Pesquisa cultural · Rio Grande do Sul',
          title: 'Uma rota bordada à mão',
          body: 'Role para levantar voo pelos quatro territórios da moda sustentável gaúcha.',
          tags: [],
        },
        {
          id: 'serra', label: 'Serra Gaúcha',
          still: 'assets/cena1.webp', clip: 'assets/vid/dive1.mp4',
          accent: '#9C4A2F',
          eyebrow: 'A rota começa na serra',
          title: 'Serra Gaúcha',
          body: 'Tradição em moda festa e noivas: ateliês que bordam sonhos em renda, entre parreirais e telhados aconchegantes.',
          tags: ['Moda festa', 'Noivas', 'Vestuário'],
        },
        {
          id: 'sinos', label: 'Vale dos Sinos',
          still: 'assets/cena2.webp', clip: 'assets/vid/dive2.mp4',
          accent: '#6E7B45',
          eyebrow: 'Do couro ao futuro',
          title: 'Vale dos Sinos',
          body: 'Berço calçadista do Brasil, hoje reinventando o couro com inovação e responsabilidade social.',
          tags: ['Calçado', 'Couro', 'Inovação'],
        },
        {
          id: 'campanha', label: 'Campanha',
          still: 'assets/cena3.webp', clip: 'assets/vid/dive3.mp4',
          accent: '#C9A227',
          eyebrow: 'O pampa veste lã',
          title: 'Região da Campanha',
          body: 'Ovinocultura, tosquia e tinturaria natural: a moda que nasce do bioma pampa, das mãos e das plantas.',
          tags: ['Lã', 'Ovinocultura', 'Tinturaria natural'],

        {

            secondary: { label: 'Seja parceiro', href: 'https://rotas-da-moda-sustentavel-rs.netlify.app/#contato' },
          },
        },
      ],
      connectors: ['assets/vid/conn0.mp4', 'assets/vid/conn1.mp4', 'assets/vid/conn2.mp4', 'assets/vid/conn3.mp4'],
    });
  </script>
</body>
</html>
